name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-supabase:
    name: Deploy Supabase (Migrations & Functions)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID || 'REDACTED_SUPABASE_PROJECT_ID' }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DATABASE_PASSWORD || secrets.SUPABASE_DB_PASSWORD }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_BATCH_MODEL: ${{ vars.OPENROUTER_BATCH_MODEL || 'xiaomi/mimo-v2.6-pro' }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Prepare Supabase secrets .env
        run: |
          mkdir -p ./supabase
          > ./supabase/.env
          if [ -n "$OPENROUTER_API_KEY" ]; then echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" >> ./supabase/.env; fi
          if [ -n "$OPENROUTER_BATCH_MODEL" ]; then echo "OPENROUTER_BATCH_MODEL=$OPENROUTER_BATCH_MODEL" >> ./supabase/.env; fi
          if [ -n "$YOUTUBE_API_KEY" ]; then echo "YOUTUBE_API_KEY=$YOUTUBE_API_KEY" >> ./supabase/.env; fi
          if [ -n "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> ./supabase/.env; fi

      - name: Deploy Supabase migrations & functions
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          if [ -s ./supabase/.env ]; then
            supabase secrets set --env-file ./supabase/.env
          fi
          supabase db push --password "$SUPABASE_DB_PASSWORD"
          supabase functions deploy daily-pipeline --no-verify-jwt

  deploy-frontend:
    name: Deploy Admin to Firebase Hosting
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'REDACTED_FIREBASE_PROJECT_ID' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'admin/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm --dir admin install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir admin build
        env:
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_ID || 'REDACTED_SUPABASE_PROJECT_ID' }}.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'REDACTED_SUPABASE_ANON_KEY' }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0003495071 }}
          channelId: live
          projectId: REDACTED_FIREBASE_PROJECT_ID
          entryPoint: ./admin